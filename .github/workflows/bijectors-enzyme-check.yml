name: Bijectors Enzyme check
run-name: Bijectors Enzyme ${{ inputs.case }} at Julia ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit in Bijectors.jl
        required: true
      head:
        description: Patched commit in Bijectors.jl
        required: true
      version:
        description: Julia version
        default: '1.10.14'
      case:
        description: Enzyme case
        default: reshape

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(format('["{0}", "{1}"]', inputs.base, inputs.head)) }}
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      REVIEW_ENZYME_CASE: ${{ inputs.case }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/Bijectors.jl
          ref: ${{ matrix.ref }}
          path: target
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
      - uses: julia-actions/cache@v3
      - name: Set up Enzyme environment
        run: |
          julia --project=target/test/integration_tests/enzyme -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.instantiate()
            versions = Dict(dep.name => dep.version for dep in values(Pkg.dependencies()))
            for (name, expected) in (("Enzyme", v"0.13.221"), ("EnzymeCore", v"0.8.28"),
                    ("Enzyme_jll", v"0.0.310+0"), ("Distributions", v"0.25.135"),
                    ("DifferentiationInterface", v"0.7.22"), ("ForwardDiff", v"1.5.0"))
                @assert versions[name] == expected (name, versions[name], expected)
            end
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Reproduce the Enzyme case
        run: julia --project=target/test/integration_tests/enzyme scripts/bijectors_enzyme_check.jl 2>&1 | tee enzyme-check.log
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: enzyme-${{ matrix.ref }}
          path: |
            enzyme-check.log
            target/test/integration_tests/enzyme/Project.toml
            target/test/integration_tests/enzyme/Manifest.toml
