name: Bijectors hashes
run-name: Review transform hash regressions

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        version: ['1.10.8', '1.13.4']
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      GROUP: All
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/Bijectors.jl
          ref: 11b05bb8ca4b6c23d2d194d040506ef8d2f47df2
          fetch-depth: 0
          path: target
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Prepare the revised regression
        run: |
          cp target/test/bijectors/equality.jl original-equality.jl
          git -C target apply ../patches/bijectors-review.patch
      - name: Update the test environment
        run: |
          julia --project=target/test -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.update()
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)' 2>&1 | tee setup.log
      - name: Check the base in a fresh process
        run: |
          git -C target checkout 77b23dfe22f908a531b5e56e9366205baaaa2484 -- src
          git -C target diff --exit-code 77b23dfe22f908a531b5e56e9366205baaaa2484 -- src
          julia --project=target/test scripts/bijectors_hash_review.jl base > base.log 2>&1
          tail -3 base.log
      - name: Check the PR in a fresh process
        run: |
          git -C target checkout 11b05bb8ca4b6c23d2d194d040506ef8d2f47df2 -- src
          git -C target diff --exit-code 11b05bb8ca4b6c23d2d194d040506ef8d2f47df2 -- src
          julia --project=target/test scripts/bijectors_hash_review.jl head > head.log 2>&1
          tail -3 head.log
      - name: Reject a plausible incorrect hash
        run: |
          julia --project=target/test scripts/bijectors_hash_review.jl mutant > mutant.log 2>&1
          tail -3 mutant.log
      - name: Check formatting
        if: matrix.version == '1.13.4'
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="1.0.62"))'
          sha256sum target/test/bijectors/equality.jl > before.sha256
          julia -e 'using JuliaFormatter; @assert pkgversion(JuliaFormatter) == v"1.0.62"; format("target/test/bijectors/equality.jl")'
          sha256sum -c before.sha256
      - name: Run the full suite once
        if: matrix.version == '1.13.4'
        run: julia --project=target/test target/test/runtests.jl > suite.log 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bijectors-hash-review-${{ matrix.version }}
          path: |
            *.log
            target/test/Project.toml
            target/test/Manifest*.toml
