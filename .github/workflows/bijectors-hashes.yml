name: Bijectors hashes
run-name: Bijectors hashes at ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit in Bijectors.jl
        required: true
      head:
        description: Patched commit in Bijectors.jl
        required: true
      versions:
        description: Julia versions as a JSON list
        default: '["1.10.8", "1"]'

      suite:
        description: Run the full Bijectors suite
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Julia ${{ matrix.version }} at ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
        ref: ${{ fromJSON(format('["{0}", "{1}"]', inputs.base, inputs.head)) }}
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      REVIEW_HEAD: ${{ matrix.ref == inputs.head }}
      GROUP: All
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/Bijectors.jl
          ref: ${{ matrix.ref }}
          path: target
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/Bijectors.jl
          ref: ${{ inputs.head }}
          path: head-tests
          sparse-checkout: test/bijectors/equality.jl
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/DynamicPPL.jl
          ref: 702b8c0b6dc4241013a179abdae6ae66a00c3fda
          path: dppl
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Set up test environment
        id: setup
        run: |
          julia --project=target/test --color=yes -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.add(PackageSpec(name="Distributions", version=v"0.25.135"))
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Check examples and new assertions
        run: julia --project=target/test --color=yes scripts/bijectors_current_hash_review.jl 2>&1 | tee checks.log
      - name: Check what the assertions miss
        if: ${{ matrix.ref == inputs.head }}
        run: |
          for mutant in all-stacked-fields omit-output-ranges logit-equals; do
            REVIEW_MUTANT="$mutant" julia --project=target/test --color=yes scripts/bijectors_current_hash_review.jl 2>&1 | tee "mutation-$mutant.log"
          done
      - name: Set up DynamicPPL integration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        id: integration
        run: |
          julia --project=integration --color=yes -e '
            using Pkg
            Pkg.develop([PackageSpec(path=abspath("target")), PackageSpec(path=abspath("dppl"))])
            Pkg.add("Distributions")
            Pkg.add(PackageSpec(name="Distributions", version=v"0.25.135"))
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Check fixed model transforms
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: julia --project=integration --color=yes scripts/bijectors_fixed_vector_review.jl 2>&1 | tee integration.log
      - name: Run full suite
        if: ${{ !cancelled() && inputs.suite && steps.setup.outcome == 'success' }}
        run: julia --project=target/test --color=yes target/test/runtests.jl 2>&1 | tee suite.log
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: bijectors-${{ matrix.version }}-${{ matrix.ref }}
          path: |
            *.log
            *.toml
            target/test/Project.toml
            target/test/Manifest*.toml
            integration/Project.toml
            integration/Manifest*.toml
