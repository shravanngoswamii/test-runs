name: BUGS fits
run-name: BUGS fits of ${{ inputs.examples }}

on:
  workflow_dispatch:
    inputs:
      mcmcjs_ref:
        description: Branch of this repository holding the mcmcjs checkout
        required: true
      juliabugs_ref:
        description: Branch of this repository holding the JuliaBUGS.jl checkout
        required: true
      examples:
        description: Example keys, as a JSON list
        required: true
      fit_timeout:
        description: Minutes each fit may take
        default: "300"
      stack:
        description: Stack size limit for the fits, as `ulimit -s` takes it, or empty for the default
        default: ""

jobs:
  fit:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(inputs.examples) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.mcmcjs_ref }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.juliabugs_ref }}
          path: juliabugs
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - run: pnpm build

      - name: Emit
        env:
          FIT_TIMEOUT_MINUTES: ${{ inputs.fit_timeout }}
        run: |
          julia --project=juliabugs/JuliaBUGS -e 'using Pkg; Pkg.instantiate()'
          julia --project=juliabugs/JuliaBUGS scripts/bugs-examples/emit.jl \
            "$GITHUB_WORKSPACE/emitted" "${{ matrix.example }}"

      # The managed project is built here, with the default stack, since precompiling
      # under a raised stack limit runs far slower.
      - name: Provision the managed Julia project
        run: |
          node packages/cli/dist/index.js setup --engine julia
          mkdir -p "$RUNNER_TEMP/provision" && cd "$RUNNER_TEMP/provision"
          printf 'using Turing\n\n@model function tiny()\n    mu ~ Normal(0, 1)\nend\n\nbuild_model(data) = tiny()\n' > tiny.jl
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" run tiny.jl --draws 10 --warmup 10 --chains 1 || [ $? -eq 2 ]

      - name: Fit, export, and plot
        working-directory: emitted
        env:
          STACK: ${{ inputs.stack }}
        run: |
          if [ -n "$STACK" ]; then ulimit -s "$STACK"; fi
          echo "stack limit: $(ulimit -s)"
          printf '#!/bin/sh\nexec node "%s" "$@"\n' "$GITHUB_WORKSPACE/packages/cli/dist/index.js" > mcmc
          chmod +x mcmc
          export PATH="$PWD:$PATH"
          sh run.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-${{ matrix.example }}
          path: emitted/bundles
          if-no-files-found: warn
