name: Review follow-up
run-name: Check the full observation suite with deprecation warnings enabled

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  observations:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      GROUP: All
      AQUA: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/DynamicPPL.jl
          ref: 956dded2778d6cd3842179c6044b0c7e617a1432
          path: target
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.4'
      - uses: julia-actions/cache@v3
      - name: Update the test environment
        run: |
          julia --project=target/test -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.update()
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)' > setup.log 2>&1
      - name: Isolate the failure on main
        run: |
          julia --project=target/test scripts/deprecation_review.jl base > base-depwarn-no.log 2>&1
          julia --depwarn=yes --project=target/test scripts/deprecation_review.jl base > base-depwarn-yes.log 2>&1
      - name: Isolate the failure on the fix
        run: |
          git -C target apply ../patches/dppl-review.patch
          julia --project=target/test scripts/deprecation_review.jl head > head-depwarn-no.log 2>&1
          julia --depwarn=yes --project=target/test scripts/deprecation_review.jl head > head-depwarn-yes.log 2>&1
      - name: Run the full DynamicPPL suite
        run: julia --startup-file=no --depwarn=yes --warn-overwrite=yes --project=target/test target/test/runtests.jl > suite.log 2>&1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: observation-review-depwarn
          path: |
            *.log
            target/test/Project.toml
            target/test/Manifest*.toml
