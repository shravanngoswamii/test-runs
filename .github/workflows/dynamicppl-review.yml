name: DynamicPPL review
run-name: DynamicPPL review of ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit in TuringLang/DynamicPPL.jl
        required: true
      head:
        description: PR commit in TuringLang/DynamicPPL.jl
        required: true
      versions:
        description: Julia versions as a JSON list
        default: '["1.10.8", "1"]'
      probe:
        description: Independent check script in test-runs
        default: scripts/dynamicppl_varinfo_queries.jl
      head_tests:
        description: Script that checks new PR assertions on both revisions
        default: scripts/dynamicppl_head_varinfo_tests.jl
      full_suite:
        description: Run the full DynamicPPL suite
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  review:
    name: Julia ${{ matrix.version }} at ${{ matrix.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
        ref: ${{ fromJSON(format('["{0}", "{1}"]', inputs.base, inputs.head)) }}
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      EXPECT_RECORDED_QUERIES: ${{ matrix.ref == inputs.head }}
      REVIEW_HEAD: ${{ matrix.ref == inputs.head }}
      GROUP: All
      AQUA: ${{ matrix.version == '1' }}
      REVIEW_PROBE: ${{ inputs.probe }}
      REVIEW_HEAD_TESTS: ${{ inputs.head_tests }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/DynamicPPL.jl
          ref: ${{ matrix.ref }}
          path: target
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/DynamicPPL.jl
          ref: ${{ inputs.head }}
          path: head-tests
          sparse-checkout: test/
          sparse-checkout-cone-mode: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Set up test environment
        id: setup
        run: |
          julia --project=target/test --color=yes -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.update()
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Check public workflows and query behaviour
        run: julia --project=target/test --depwarn=yes --color=yes "$REVIEW_PROBE" 2>&1 | tee probes.log
      - name: Check PR tests on this revision
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: julia --project=target/test --depwarn=yes --color=yes "$REVIEW_HEAD_TESTS" 2>&1 | tee head-tests.log
      - name: Run full suite
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.full_suite }}
        run: julia --project=target/test --depwarn=yes --color=yes target/test/runtests.jl 2>&1 | tee suite.log
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: dynamicppl-${{ matrix.version }}-${{ matrix.ref }}
          path: |
            *.log
            results.toml
            target/test/Project.toml
            target/test/Manifest*.toml
