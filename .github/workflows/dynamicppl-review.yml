name: Turing sampler docs
run-name: Turing sampler docs on Julia ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Julia version
        default: '1.13.4'
      full_suite:
        description: Run the full Turing suite after the probes
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/Turing.jl
          ref: 168dbea1d2ca555cf21064bd5d438e625658f363
          path: target
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
      - uses: julia-actions/cache@v3
      - name: Update test environment
        run: |
          julia --project=target/test --color=yes -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.update()
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)' 2>&1 | tee setup.log
      - name: Check base behavior
        run: julia --project=target/test --color=yes scripts/turing_sampler_keywords.jl base 2>&1 | tee base-probe.log
      - name: Update documentation environment
        run: |
          julia --project=target/docs --color=yes -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.update()
            Pkg.instantiate()
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)' 2>&1 | tee docs-setup.log
      - name: Build base documentation
        run: |
          julia --project=target/docs --color=yes target/docs/make.jl 2>&1 | tee base-docs.log
          mv target/docs/build base-docs
      - name: Apply documentation patch
        run: git -C target apply ../patches/turing-sampler-keyword-docs.patch
      - name: Check patched behavior
        run: julia --project=target/test --color=yes scripts/turing_sampler_keywords.jl head 2>&1 | tee head-probe.log
      - name: Build patched documentation
        run: |
          julia --project=target/docs --color=yes target/docs/make.jl 2>&1 | tee head-docs.log
          python3 - <<'PY'
          from pathlib import Path
          base = Path('base-docs/api/Inference/index.html').read_text()
          head = Path('target/docs/build/api/Inference/index.html').read_text()
          assert 'For a new chain, the following keywords' not in base
          assert 'For a new chain, the following keywords' in head
          print('Adaptive sampler docstring is present in the rendered API page.')
          PY
      - name: Check formatting
        run: |
          julia --color=yes -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="1.0.62"))'
          sha256sum target/src/mcmc/hmc.jl > formatter-before.sha256
          julia --color=yes -e 'using JuliaFormatter; @assert pkgversion(JuliaFormatter) == v"1.0.62"; format("target/src/mcmc/hmc.jl")'
          git -C target diff > formatted.patch
          sha256sum -c formatter-before.sha256
      - name: Run full Turing suite
        if: ${{ inputs.full_suite }}
        run: julia --project=target/test --color=yes target/test/runtests.jl 2>&1 | tee suite.log
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: turing-sampler-docs-${{ inputs.version }}
          path: |
            *.log
            *.toml
            *-help.txt
            formatted.patch
            target/test/Manifest*.toml
            target/docs/Manifest*.toml
            base-docs/
            target/docs/build/
