name: Turing sampling guide
run-name: Render the adaptive sampling guide

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/docs
          ref: 5c36b7a3718b0d9bd0e8a478260148e11ee057ba
          path: target
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      - name: Render the original page
        working-directory: target
        run: |
          quarto --version
          quarto render usage/sampling-options/index.qmd --no-execute --metadata engine:markdown 2>&1 | tee ../base-guide.log
          test -s _site/usage/sampling-options/index.html
          mv _site ../base-site
      - name: Apply the guide patch
        run: |
          git -C target apply ../patches/turing-adaptive-sampling-guide.patch
          python3 - <<'PYTHON'
          from pathlib import Path
          import re, subprocess
          path = 'usage/sampling-options/index.qmd'
          base = subprocess.check_output(['git', '-C', 'target', 'show', f'HEAD:{path}'], text=True)
          head = Path('target', path).read_text()
          assert re.findall(r'```.*?```', base, re.S) == re.findall(r'```.*?```', head, re.S)
          print('Every code block is unchanged.')
          PYTHON
      - name: Render the updated page
        working-directory: target
        run: |
          quarto render usage/sampling-options/index.qmd --no-execute --metadata engine:markdown 2>&1 | tee ../head-guide.log
          test -s _site/usage/sampling-options/index.html
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sampling-guide-render
          path: |
            *-guide.log
            base-site/
            target/_site/
