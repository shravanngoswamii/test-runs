name: DynamicPPL storage compat

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        revision: [base, head]
        abstractppl: ['0.15.2', '0.15.3']
    env:
      JULIA_NUM_PRECOMPILE_TASKS: '2'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      REVIEW_REVISION: ${{ matrix.revision }}
      REVIEW_ABSTRACTPPL: ${{ matrix.abstractppl }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/DynamicPPL.jl
          ref: ${{ matrix.revision == 'head' && '86b4a88e5d8ad19a19350908db531db0cfdb22dc' || '98bab95b322649039fa419ab16bbcc8470d47e49' }}
          path: target
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10.8'
      - uses: julia-actions/cache@v3
      - name: Resolve the supported dependency version
        run: |
          julia --project=compat-env -e '
            using Pkg
            Pkg.develop(path=abspath("target"))
            Pkg.update()
            Pkg.add(PackageSpec(name="AbstractPPL", version=VersionNumber(ENV["REVIEW_ABSTRACTPPL"])))
            Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Check package loading and templates
        run: julia --project=compat-env scripts/dynamicppl_storage_compat.jl 2>&1 | tee compat.log
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: storage-compat-${{ matrix.revision }}-${{ matrix.abstractppl }}
          path: |
            compat.log
            compat-env/Project.toml
            compat-env/Manifest.toml
