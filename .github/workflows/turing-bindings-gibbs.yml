name: Diagnose Gibbs particle weights

on:
  push:
    branches: [sg/turing-bindings-gibbs]

permissions:
  contents: read

jobs:
  test:
    name: Gibbs / ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base-base
            dynamicppl: e0c62ec0b22cc844e4ca605eda08321b606eb892
          - case: base-head
            dynamicppl: e924cf288a1482fd994477ed1ea2cded8c129ae0
          - case: migrated
            dynamicppl: e924cf288a1482fd994477ed1ea2cded8c129ae0
          - case: mark-map
            dynamicppl: e924cf288a1482fd994477ed1ea2cded8c129ae0
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: shravanngoswamii/Turing.jl
          ref: 67a9f804e376a1fc18ed8362532458063f443864
          path: target
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/DynamicPPL.jl
          ref: ${{ matrix.dynamicppl }}
          path: dynamicppl
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: shravanngoswamii/AdvancedVI.jl
          ref: 8f7d5c0763afe805b7105d61e98f9e47942a02b7
          path: advancedvi
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: JuliaBayes/FlexiChains.jl
          ref: e23d67855766df5cf20212d3ab3abac15fb1768b
          path: flexichains
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.4'
      - uses: julia-actions/cache@v3
      - name: Prepare pinned dependencies
        shell: bash
        run: |
          git -C flexichains apply "$PWD/fixtures/turing-bindings/flexi.patch"
          mkdir test-env
          cp fixtures/turing-bindings/{Project,Manifest}.toml test-env/
          julia --startup-file=no --project=test-env -e 'using Pkg; Pkg.instantiate(; allow_autoprecomp=false); Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)' | tee setup.log
      - name: Apply the Turing migration
        if: matrix.case == 'migrated' || matrix.case == 'mark-map'
        shell: bash
        run: git -C target apply "$PWD/fixtures/turing-bindings/turing.patch"
      - name: Capture weights and seeded draws
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: julia --startup-file=no --depwarn=yes --project=test-env fixtures/turing-bindings/gibbs-probe.jl "$CASE"
