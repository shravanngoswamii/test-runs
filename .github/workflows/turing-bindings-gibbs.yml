name: Check particle weights on Julia 1.10

on:
  push:
    branches: [sg/turing-bindings-gibbs]

permissions:
  contents: read

jobs:
  test:
    name: Particles on Julia 1.10.8
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: shravanngoswamii/Turing.jl
          ref: 67a9f804e376a1fc18ed8362532458063f443864
          path: target
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: TuringLang/DynamicPPL.jl
          ref: e924cf288a1482fd994477ed1ea2cded8c129ae0
          path: dynamicppl
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: shravanngoswamii/AdvancedVI.jl
          ref: 8f7d5c0763afe805b7105d61e98f9e47942a02b7
          path: advancedvi
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: JuliaBayes/FlexiChains.jl
          ref: e23d67855766df5cf20212d3ab3abac15fb1768b
          path: flexichains
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10.8'
      - uses: julia-actions/cache@v3
      - name: Resolve dependencies for Julia 1.10
        shell: bash
        run: |
          git -C flexichains apply "$PWD/fixtures/turing-bindings/flexi.patch"
          mkdir test-env
          cp fixtures/turing-bindings/Project.toml test-env/
          julia --startup-file=no --project=test-env -e 'using Pkg; Pkg.develop([PackageSpec(; path=pwd() * "/" * p) for p in ("dynamicppl", "advancedvi", "flexichains", "target")]); Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)' | tee setup.log
      - name: Apply the Turing migration
        shell: bash
        run: git -C target apply "$PWD/fixtures/turing-bindings/turing.patch"
      - name: Check local models and keyword arguments
        shell: bash
        run: julia --startup-file=no --depwarn=yes --project=test-env fixtures/turing-bindings/particle-weights.jl
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: julia-1.10-environment
          path: |
            setup.log
            test-env/Project.toml
            test-env/Manifest.toml
